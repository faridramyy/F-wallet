name: Deploy

# Every push to main runs the CI checks, then waits for your approval
# (the "production" environment has a required reviewer), then deploys:
#   backend  -> the API Lambda function (code only; settings live in AWS)
#   frontend -> the S3 bucket behind CloudFront
# It can also be started by hand from the Actions tab.
#
# Setup (AWS resources, OIDC role, GitHub variables): docs/DEPLOYMENT.md
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy
# that is half done.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    permissions:
      contents: read
      id-token: write # sign in to AWS with OIDC, no stored AWS keys

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Backend --------------------------------------------------------------

      - name: Package Lambda
        run: ./scripts/package-lambda.sh

      - name: Deploy Lambda
        env:
          FUNCTION: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb://build/lambda.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          echo "Lambda $FUNCTION updated"

      - name: Check the API
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${{ vars.VITE_API_BASE_URL }}/health"; then
              echo; exit 0
            fi
            sleep 5
          done
          echo "::error::The API health check failed after the deploy."
          exit 1

      # Frontend -------------------------------------------------------------

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
        run: npm run build

      # Hashed files under assets/ never change, so browsers may cache them
      # for a year. Everything else (index.html, icons, manifest) is checked
      # on every visit so a deploy shows up right away.
      - name: Upload frontend
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 sync frontend/dist/assets "s3://$BUCKET/assets" \
            --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync frontend/dist "s3://$BUCKET" \
            --delete --exclude "assets/*" --cache-control "no-cache"

      - name: Refresh CloudFront
        env:
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" --paths "/*" \
            --output text --query 'Invalidation.Id'
