<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>F-Wallet</title>
    <meta
      name="description"
      content="F-Wallet — your personal finance dashboard."
    />

    <!-- Icons: browser tabs and bookmarks, iOS home screen, Android / installed app -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Installed app / "Add to Home Screen" -->
    <meta name="application-name" content="F-Wallet" />
    <meta name="apple-mobile-web-app-title" content="F-Wallet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="theme-color"
      content="#f9f9f9"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Link previews when the URL is shared (Messages, WhatsApp, Slack...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="F-Wallet" />
    <meta property="og:title" content="F-Wallet" />
    <meta property="og:description" content="Your finances, under control." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/icon-512.png" />
    <script>
      // Apply the last-used theme before the first paint (see hooks/useTheme.js).
      try {
        const theme = localStorage.getItem("f-wallet-theme") || "system";
        const dark =
          theme === "dark" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
